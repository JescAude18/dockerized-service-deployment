---

name: Dockerized Nodejs Service Deployment with GHCR

on:
  push:
    branches:
      - 'main'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare_image:
    runs-on: ubuntu-24.04

    steps:
      - name: Login to Github Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name # should be in lowercase
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dockerized-nodejs-service" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
      runs-on: ubuntu-24.04

      steps:

        - name: Pull Nodejs Application Image Built
          uses: appleboy/ssh-action@v1
          env:
            GHCR_USERNAME: ${{ github.repository_owner }}
            GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            IMAGE_NAME: ${{ env.IMAGE_NAME }}
          with:
            host: ${{ vars.SERVER_IP }}
            username: ${{ vars.SERVER_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            envs: GHCR_USERNAME, GHCR_TOKEN, IMAGE_NAME
            script: |
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
              docker pull "$IMAGE_NAME":${{ github.sha }}

        - name: Run Nodejs Container on the VM
          uses: appleboy/ssh-action@v1
          env:
            APP_USERNAME: ${{ secrets.APP_USERNAME }}
            APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
            SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}
            IMAGE_NAME: ${{ env.IMAGE_NAME }}
          with:
            host: ${{ vars.SERVER_IP }}
            username: ${{ vars.SERVER_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            envs: APP_USERNAME, APP_PASSWORD, SECRET_MESSAGE, IMAGE_NAME
            script: |
              docker run --name dockerized-nodejs-service -e APP_USERNAME="$APP_USERNAME" \
              -e APP_PASSWORD="$APP_PASSWORD" -e SECRET_MESSAGE="$SECRET_MESSAGE" \
              -p 3000:3000 "$IMAGE_NAME":${{ github.sha }}

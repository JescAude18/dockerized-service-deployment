---

name: Dockerized Nodejs Service Deployment with GHCR

on:
  push:
    branches:
      - 'main'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare_image:
    runs-on: ubuntu-24.04

    steps:
      - name: Login to Github Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name # should be in lowercase
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dockerized-nodejs-service" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
